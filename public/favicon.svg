<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="医键排班">
  <!--
    医键排班 favicon
    32×32 实底 + 白色描边图形，与 src/components/ui/Icons.tsx 的 medcross 同构：
    日历外框 + 表头分隔线 + 两个挂环 + 表格区居中的医疗十字。
    底色 #00838F 取自 --primary-600；不用渐变、不用细于 2px 的线——
    16px 显示时任何细节都会糊成一团灰。
  -->
  <rect width="32" height="32" rx="7" fill="#00838F"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="9" width="18" height="16" rx="2"/>
    <path d="M7 14h18"/>
    <path d="M12 6.5v4M20 6.5v4"/>
    <path d="M16 17v5M13.5 19.5h5"/>
  </g>
</svg>
